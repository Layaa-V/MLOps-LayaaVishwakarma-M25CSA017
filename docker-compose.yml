version: "3.9"

# docker-compose.yml
# This file starts ALL services together for local testing:
#   backend   → Flask API (port 8000)
#   frontend  → Streamlit customer UI (port 8501)
#   prometheus → collects metrics from Flask (port 9090)
#   grafana   → shows live dashboards reading from Prometheus (port 3000)

services:

  backend:
    build: ./backend
    container_name: sd-backend
    ports:
      - "8005:8000"
    environment:
      - WANDB_API_KEY=${WANDB_API_KEY}
      - WANDB_PROJECT=fashion-discovery-engine
      - GCS_BUCKET=${GCS_BUCKET:-}
      - FEEDBACK_LOG=/app/feedback_log.json
      - IMAGES_DIR=/app/images
    volumes:
      # Mount feedback_log.json so it persists even if container is restarted
      - ./feedback_log.json:/app/feedback_log.json
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sd-frontend
    ports:
      - "8505:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9095:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS}
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/fashion.json
      - ./monitoring/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/provider.yml
      - ./feedback_log.json:/app/feedback_log.json
    depends_on:
      - prometheus
    restart: unless-stopped
