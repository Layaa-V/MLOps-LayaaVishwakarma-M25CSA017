apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: fashion-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fashion-backend
  template:
    metadata:
      labels:
        app: fashion-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: layaav/fashion-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fashion-secrets
                  key: WANDB_API_KEY
            - name: WANDB_PROJECT
              valueFrom:
                configMapKeyRef:
                  name: fashion-config
                  key: WANDB_PROJECT
            - name: GCS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: fashion-config
                  key: GCS_BUCKET
            # --- NEW: Tell Python where to find the key ---
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/var/secrets/google/key.json"
            - name: GOOGLE_CLOUD_PROJECT
              value: "fashion-engine-493912"
          
          # --- NEW: Mount the secret into the container ---
          volumeMounts:
            - name: google-cloud-key
              mountPath: /var/secrets/google
              readOnly: true
              
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            
      # --- NEW: Define the volume from your K8s secret ---
      volumes:
        - name: google-cloud-key
          secret:
            secretName: gcs-credentials